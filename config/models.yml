# Master list of all models available to the Nomic Engine.
# The 'create_game.py' script will read this to let the user
# choose models for their game.

models:
  - id: "claude-haiku-4-5"
    provider: "anthropic"
    api_model_id: "claude-haiku-4-5"
    env_key_name: "ANTHROPIC_API_KEY"

  - id: "claude-sonnet-4-5"
    provider: "anthropic"
    api_model_id: "claude-sonnet-4-5"
    env_key_name: "ANTHROPIC_API_KEY"

  - id: "gpt-5.2"
    provider: "openai"
    api_model_id: "gpt-5.2"
    env_key_name: "OPENAI_API_KEY"

  - id: "gpt-5-mini"
    provider: "openai"
    api_model_id: "gpt-5-mini"
    env_key_name: "OPENAI_API_KEY"

  - id: "gemini-2.5-pro"
    provider: "google"
    api_model_id: "gemini-2.5-pro"
    env_key_name: "GOOGLE_API_KEY"

  - id: "gemini-2.5-flash"
    provider: "google"
    api_model_id: "gemini-2.5-flash"
    env_key_name: "GOOGLE_API_KEY"

  - id: "gemini-2.5-flash-lite"
    provider: "google"
    api_model_id: "gemini-2.5-flash-lite"
    env_key_name: "GOOGLE_API_KEY"

  - id: "grok-4-1-fast-reasoning"
    provider: "xai"
    api_model_id: "grok-4-1-fast-reasoning"
    env_key_name: "XAI_API_KEY"

  - id: "grok-4-1-fast-non-reasoning"
    provider: "xai"
    api_model_id: "grok-4-1-fast-non-reasoning"
    env_key_name: "XAI_API_KEY"

  - id: "deepseek-r1:32b"
    provider: "local"
    api_model_id: "http://localhost:11434/v1" # Ollama
    env_key_name: null

  - id: "qwen3:32b"
    provider: "local"
    api_model_id: "http://localhost:11434/v1" # Ollama
    env_key_name: null

  - id: "gemma3:27b"
    provider: "local"
    api_model_id: "http://localhost:11434/v1" # Ollama
    env_key_name: null

  - id: "qwq:latest"
    provider: "local"
    api_model_id: "http://localhost:11434/v1" # Ollama
    env_key_name: null

  # Subscription sign-in through the grok CLI. Not an API key. The factory
  # refuses this provider unless `python -m src.nomic_engine.live_run
  # grok-cli` has opted in. See docs/LIVE_RUN.md.
  - id: "grok-cli"
    provider: "grok_cli"
    api_model_id: "default"
    env_key_name: null
