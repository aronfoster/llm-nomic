[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
strict = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "attempts_network: deliberately attempts a provider call; the offline guard must stop it before transmission",
]

[tool.black]
line-length = 79
target-version = ['py312']

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
# E (pycodestyle errors), W (warnings), F (Pyflakes), I (isort)
select = ["E", "W", "F", "I"]
