[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*", "dotenv", "dotenv.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nomic_engine.data_models"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
line-length = 79
target-version = ['py310']

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
# E (pycodestyle errors), W (warnings), F (Pyflakes), I (isort)
select = ["E", "W", "F", "I"]
