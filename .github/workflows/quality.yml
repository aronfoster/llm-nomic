# This is the GitHub Actions workflow file.
# It defines the CI checks that run on every pull request.

name: Code Quality Check

# Run this workflow on all pull requests and pushes to the main branch
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # Define a single job named "lint-and-test"
  lint-and-test:
    runs-on: ubuntu-latest # Use a standard Linux runner
    strategy:
      matrix:
        python-version: ["3.10", "3.11"] # Test on multiple Python versions

    steps:
      # 1. Get the code from the repository
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Set up the specified Python version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. Run Ruff (Linter)
      - name: Run Ruff
        run: ruff check src tests

      # 5. Run Black (Formatter - check mode)
      - name: Run Black
        run: black --check src tests

      # 6. Run MyPy (Type Checker)
      - name: Run MyPy
        run: mypy src

      # 7. Run Pytest (Unit Tests)
      - name: Run Pytest
        run: pytest
